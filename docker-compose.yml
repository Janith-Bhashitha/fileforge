services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # image: names the tag `build` produces locally AND what `pull` fetches
    # in a deploy that never builds at all (docker compose pull, no build flag) -
    # one name serves both, so local dev and the deployed box can't drift
    # into using a differently-tagged image by accident.
    image: ${DOCKERHUB_USERNAME:-fileforge}/fileforge-api:latest
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    volumes:
      - api_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The frontend, served by nginx, which also proxies /api through to the API
  # container. Same origin means no CORS and no absolute backend URL baked
  # into the bundle at build time.
  web:
    image: ${DOCKERHUB_USERNAME:-fileforge}/fileforge-web:latest
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    restart: unless-stopped
    ports:
      # Not 3000: Grafana already uses that under the observability profile.
      - "3001:80"
    depends_on:
      - api

  worker-pdf:
    image: ${DOCKERHUB_USERNAME:-fileforge}/fileforge-worker-pdf:latest
    build:
      context: .
      dockerfile: infrastructure/docker/worker-pdf/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - api_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-image:
    image: ${DOCKERHUB_USERNAME:-fileforge}/fileforge-worker-image:latest
    build:
      context: .
      dockerfile: infrastructure/docker/worker-image/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - api_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-office:
    image: ${DOCKERHUB_USERNAME:-fileforge}/fileforge-worker-office:latest
    build:
      context: .
      dockerfile: infrastructure/docker/worker-office/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - api_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ocr, document-insights and ai-analyze - the only worker with an external
  # dependency (Gemini) instead of just OS packages, and the only one that
  # fails per-request rather than at startup when unconfigured.
  worker-ai:
    image: ${DOCKERHUB_USERNAME:-fileforge}/fileforge-worker-ai:latest
    build:
      context: .
      dockerfile: infrastructure/docker/worker-ai/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    volumes:
      - api_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # MinIO speaks the S3 API, so it exercises the exact same code path the
  # AWS deployment uses - no AWS account needed to test the S3 backend.
  # `docker compose --profile s3 up -d`
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Observability, behind a profile so the everyday `docker compose up`
  # stays lean: `docker compose --profile observability up -d`.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  api_storage:
  prometheus_data:
  grafana_data:
  minio_data:
