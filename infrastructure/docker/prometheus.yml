global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fileforge-api
    static_configs:
      - targets: ["api:8080"]

  # Workers expose the same metric names on the same port; the job label is
  # what separates them in a query.
  - job_name: fileforge-workers
    static_configs:
      - targets:
          - "worker-pdf:8080"
          - "worker-image:8080"
          - "worker-office:8080"
