# Plain HTTP. Kept working (not redirected to HTTPS) because there's no real
# certificate here - only a self-signed one (see the Dockerfile) - so someone
# who explicitly types http:// still gets a working page with no warning at
# all, rather than being forced onto a connection their browser will flag.
server {
    listen 80;
    server_name _;
    include /etc/nginx/locations.conf;
}

# HTTPS with a self-signed certificate. This exists because modern browsers -
# Chrome's HTTPS-First Mode in particular, on by default and especially
# aggressive on mobile - silently rewrite a bare address typed without a
# scheme to https://, and before this block existed nothing was listening on
# 443 at all: the connection didn't fail fast, it hung for the full timeout,
# which is indistinguishable from the server being down. A real trusted
# certificate needs a domain name to validate against (Let's Encrypt can't
# issue one for a bare IP); self-signed is the honest option available
# without registering one. The browser shows a one-time "not secure"
# warning that can be clicked through - a real warning about a real
# limitation - instead of a silent, unexplained timeout.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/locations.conf;
}
