# Shared between the HTTP and HTTPS server blocks in nginx.conf, so the
# actual routing logic exists in exactly one place - two independently
# hand-maintained copies would drift the moment one got a fix the other
# didn't.

root /usr/share/nginx/html;
index index.html;

# Uploads are capped at 50MB in the app (validate.MaxUploadSize); nginx
# defaults to 1MB and would reject anything larger with a 413 before the
# request ever reached the API.
client_max_body_size 60M;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Hashed asset filenames change whenever their content does, so they can
# be cached indefinitely. index.html must never be cached, or browsers
# keep loading an old bundle that points at assets which no longer exist.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# nginx's bundled mime.types has no entry for .mjs, so an ES module asset is
# served as application/octet-stream - and browsers refuse to execute a
# module script or worker with that type. The pdf.js worker is a .mjs, so
# without this the worker never starts and every PDF fails to open with
# what looks like a corrupt-file error.
#
# A regex location wins over the /assets/ prefix match above, so the
# long-cache headers have to be repeated here rather than inherited.
location ~ \.mjs$ {
    types { }
    default_type text/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# API and health pass through to the Go service. Same origin as the page,
# so the browser never makes a cross-origin request and CORS never applies.
location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The API rate-limits unauthenticated routes per IP, so it has to see
    # the caller's address rather than nginx's.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Conversions are synchronous on the /convert endpoint and a large
    # LibreOffice job can take a while; the 60s default would cut it off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Avatars are served by the API but deliberately live outside /api/ - they
# are loaded by plain <img> tags, which can't attach an Authorization
# header, so the route is unauthenticated. Without this block they fall
# through to the SPA catch-all below and the browser is handed index.html
# where it expected a PNG.
location /avatars/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /healthz {
    proxy_pass http://api:8080/healthz;
}

location = /metrics {
    proxy_pass http://api:8080/metrics;
}

# Client-side routing: the app owns /convert, /files, /batches and the
# rest, so any unmatched path must return index.html and let the router
# resolve it. Without this, refreshing on /files is a 404.
location / {
    try_files $uri $uri/ /index.html;
}
