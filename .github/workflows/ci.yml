name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go build, vet & test
    runs-on: ubuntu-latest
    services:
      # MinIO stands in for S3 so the storage integration tests run for real
      # in CI, with no AWS account and no mocks.
      minio:
        image: minio/minio:RELEASE.2024-11-07T00-52-20Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/api/go.sum

      - name: Create the test bucket
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
          chmod +x mc
          ./mc alias set local http://localhost:9000 minioadmin minioadmin
          ./mc mb --ignore-existing local/fileforge

      - name: gofmt
        working-directory: services/api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        working-directory: services/api
        run: go build ./...

      - name: Vet
        working-directory: services/api
        run: go vet ./...

      - name: Test
        working-directory: services/api
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_BUCKET: fileforge
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin
        run: go test ./... -v

  frontend:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: npm run build

  images:
    name: Docker images build & push
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      matrix:
        service: [api, worker-pdf, worker-image, worker-office, worker-ai, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A PR build has no registry credentials and shouldn't push - it only
      # needs to prove the Dockerfile still builds against the changed code
      # (catching a missing OS package or a renamed binary, which `go build`
      # can't). Only a push to main, which is meant to be deployable, pushes
      # an image anywhere.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A fork PR gets no secrets at all (GitHub withholds them from fork
      # workflow runs), so this can't assume DOCKERHUB_USERNAME exists here -
      # a PR tags and loads the image locally under a fixed throwaway name
      # instead of ${{ secrets.DOCKERHUB_USERNAME }}/..., which would
      # otherwise resolve to an invalid "/fileforge-api:latest" tag.
      - name: Build (PR validation only, no push)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: fileforge-${{ matrix.service }}:pr-check

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fileforge-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fileforge-${{ matrix.service }}:${{ github.sha }}
          # The registry's own layer cache stands in for actions/cache here -
          # simpler, and it's already warm from the previous push rather than
          # needing its own separate cache artifact.
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fileforge-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fileforge-${{ matrix.service }}:buildcache,mode=max
